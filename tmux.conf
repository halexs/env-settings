# env-settings tmux config (tmux 3.2+; tested on 3.4)
#
# Prefix is Alt-a (M-a). On macOS the Option key must act as Alt:
#   Ghostty    macos-option-as-alt = true   (set by `make terminal`)
#   iTerm2     Profiles > Keys > Left Option key: Esc+
#   Terminal   Profiles > Keyboard > Use Option as Meta key
#   WezTerm    send_composed_key_when_left_alt_is_pressed = false

# --- prefix -----------------------------------------------------------------
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# --- terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
if-shell 'tmux -V | awk "{exit !(\$2 >= 3.2)}"' \
  'set -as terminal-features ",*:RGB,*:hyperlinks"'
set -g focus-events on               # lets vim notice external file changes
set -sg escape-time 10               # no lag after <Esc> in vim
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on              # OSC 52: copy to the system clipboard over ssh too
set -g allow-rename off
set -g aggressive-resize on
set -g display-time 1500
set -g status-interval 5

# Numbering starts at 1 to match the keyboard; no gaps after closing windows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- keys -------------------------------------------------------------------
set -g mode-keys vi
set -g status-keys vi

# Reload.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind -n M-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# New panes/windows open in the current directory.
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Alt-hjkl moves between panes, Alt-n / Alt-p between windows, Alt-1..9 jumps.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-z resize-pane -Z
bind -n M-w choose-tree -Zw
bind -n M-s choose-tree -s
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Resize: prefix, then (repeatable) Alt-arrow or H/J/K/L.
bind -r M-Left  resize-pane -L 5
bind -r M-Down  resize-pane -D 5
bind -r M-Up    resize-pane -U 5
bind -r M-Right resize-pane -R 5
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Claude Code in a split on the right (prefix, then C).
bind C split-window -h -p 40 -c '#{pane_current_path}' 'claude'

# Prefix ? opens the searchable help palette (the default list-keys is still on prefix : list-keys).
bind ? display-popup -E -w 85% -h 85% -d '#{pane_current_path}' 'ES_HELP_PAGER=1 h'

# Popups: prefix m renders the README (or any *.md you pick), prefix / opens this
# setup's workflow guide. Needs tmux 3.2+.
bind m display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'md || sleep 2'
bind / display-popup -E -w 90% -h 90% 'md "${ENVSETTINGS:-$HOME/env-settings}/docs/WORKFLOW.md"'
bind M display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'md -f'

# --- copy mode (vi) -----------------------------------------------------------
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
# Also copy to the macOS / Wayland / X11 clipboard when a helper is available.
if-shell 'command -v pbcopy' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "command -v wl-copy" \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel wl-copy; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel wl-copy" \
    "if-shell \"command -v xclip\" \
      \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel \\\"xclip -selection clipboard -in\\\"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel \\\"xclip -selection clipboard -in\\\"\" \
      \"bind -T copy-mode-vi y send -X copy-selection-and-cancel\""'

# --- look (Catppuccin Mocha) --------------------------------------------------
set -g status-position bottom
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] '
set -g status-right '#{?client_prefix,#[bg=#f38ba8 fg=#1e1e2e bold] PREFIX #[default] ,}#[fg=#a6adc8]#h  %a %d %b  %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-style 'fg=#6c7086'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-style 'bg=#313244,fg=#89b4fa,bold'
setw -g window-status-activity-style 'fg=#f9e2af'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
